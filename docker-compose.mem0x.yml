# mem0x 记忆增强服务
# 启动: sudo docker compose -f docker-compose.mem0x.yml up -d
# 重启: sudo docker compose -f docker-compose.mem0x.yml restart
# 日志: sudo docker compose -f docker-compose.mem0x.yml logs -f

services:
  mem0x:
    image: mem0x:0.1.0
    container_name: mem0x
    restart: unless-stopped
    ports:
      - "28768:28768"
    volumes:
      - ${MEM0X_DATA_DIR:-~/.mem0x/data}:/app/data
      - ${MEM0X_CONFIG:-~/.mem0x/config-compose.json}:/app/config.json:ro
    environment:
      MEM0X_CONFIG: /app/config.json
    networks:
      - mem0x-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28768/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  mem0x-net:
    external: true
